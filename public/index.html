<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Better Transit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0a7d3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Better Transit</h1><div class="hdr-r"><button id="updated" aria-label="Refresh"></button><button id="devices-btn" aria-label="Signed-in devices" hidden><i data-icon="smartphone"></i></button><button id="routes-btn" aria-label="Choose which routes to show"><i data-icon="sliders-horizontal"></i></button></div></header>
<main>
  <section id="pinned">
    <div id="ptr" aria-hidden="true"><i data-icon="refresh-cw"></i></div>
    <div class="sbox"><i class="lead" data-icon="search"></i><input id="pin-search" type="search" placeholder="Search a route (60) or stop" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="suggest" id="pin-suggest"></div></div>
    <div id="pins"></div>
    <div id="nearby"></div>
  </section>

  <section id="plan" hidden>
    <div class="places" id="places"></div>
    <div id="commutes"></div>
    <div class="route-inputs">
      <div class="sbox"><i class="lead" data-icon="map-pin"></i><input id="from" type="search" placeholder="From: place, stop or bus line" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="suggest" id="from-suggest"></div></div>
      <button id="swap" title="Swap" aria-label="Swap from and to"><i data-icon="arrow-up-down"></i></button>
      <div class="sbox"><i class="lead" data-icon="flag"></i><input id="to" type="search" placeholder="To: place, stop or bus line" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="suggest" id="to-suggest"></div></div>
    </div>
    <div class="opt" id="leave"><button data-when="now" class="on">Leave now</button><button data-when="depart">Depart at</button><button data-when="arrive">Arrive by</button><input type="datetime-local" id="when" hidden></div>
    <div class="opt"><button id="acc" aria-pressed="false"><i data-icon="accessibility"></i> Accessible trips only</button></div>
    <div id="trip"></div>
  </section>

  <section id="map" hidden>
    <div class="mapbar">
      <div class="seg"><button data-mode="all">All</button><button data-mode="pins">My pins</button></div>
      <input id="maproute" type="search" inputmode="numeric" placeholder="Route #" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="locate" title="My location" aria-label="My location"><i data-icon="locate-fixed"></i></button>
    </div>
    <div id="mapbox"></div>
  </section>

  <section id="alerts" hidden></section>
</main>

<nav class="tabs">
  <button data-tab="pinned" class="on"><i data-icon="pin"></i>Pinned</button>
  <button data-tab="plan"><i data-icon="navigation"></i>Plan</button>
  <button data-tab="map"><i data-icon="map"></i>Map</button>
  <button data-tab="alerts"><i data-icon="triangle-alert"></i><span id="alert-badge" class="tabbadge"></span>Alerts</button>
</nav>
<div id="snack" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="icons-data.js"></script>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
